<style>
.btn,.ghost{min-height:44px;touch-action:manipulation}
@media (max-width:520px){ .stats{grid-template-columns:repeat(3,1fr)} .stat b{font-size:1.15rem} th,td{padding:8px 6px;font-size:.88rem} }
.sub{color:var(--muted);margin:0 0 20px}
.panel{display:none}.panel.on{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:14px}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:.8rem;padding:2px 10px;border-radius:99px;font-weight:600}
form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
label{font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,select{font:inherit;font-size:16px;min-width:0;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;padding:10px 18px;font:600 1rem var(--sans);cursor:pointer;align-self:end}
.btn:hover{filter:brightness(.95)}
.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 10px;cursor:pointer;font:inherit}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:start;padding:10px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;font-size:.85rem}
.tablewrap{overflow-x:auto}
.empty{color:var(--muted);text-align:center;padding:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--surface2);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:1.4rem;color:var(--accent)}
.meal ul{margin:6px 0 0;padding-inline-start:18px;color:var(--muted)}
a{color:var(--accent)}
.food{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.food img,.food .ph{width:52px;height:52px;border-radius:9px;object-fit:cover;background:var(--surface2);flex:none}
.food .info{flex:1;min-width:0}
.food .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.food .add{display:flex;gap:6px;align-items:center;flex:none}
.food .add input{width:76px;padding:7px}
.food .add .btn{padding:8px 12px;min-height:40px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:99px;padding:8px 16px;font:600 .95rem var(--sans);cursor:pointer;min-height:40px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
[hidden]{display:none!important}
.prog{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.prog .info{flex:1;min-width:0}
.prog .n{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:.85rem;flex:none}
.ico{display:block;width:30px;height:30px;margin:0 auto 2px}
.ico svg{width:100%;height:100%;overflow:visible}
.flame{transform-origin:12px 20px;animation:flick 1.4s ease-in-out infinite}
.flame2{transform-origin:12px 18px;animation:flick 1s ease-in-out infinite reverse}
@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.92,1.08)}}
.lift{animation:lift 1.6s ease-in-out infinite}
@keyframes lift{0%,100%{transform:translateY(2px)}50%{transform:translateY(-3px)}}
.sway{transform-origin:12px 22px;animation:sway 2.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.sway .g1,.sway .g2,.sway .g3{animation:grain 2.4s ease-in-out infinite}
.sway .g2{animation-delay:.2s}.sway .g3{animation-delay:.4s}
@keyframes grain{0%,100%{opacity:1}50%{opacity:.75}}
.drip{transform-origin:12px 20px;animation:drip 2s cubic-bezier(.5,0,.5,1) infinite}
@keyframes drip{0%{transform:translateY(-3px) scale(1,1)}55%{transform:translateY(1px) scale(1,1)}70%{transform:translateY(1px) scale(1.12,.86)}85%{transform:translateY(0) scale(.96,1.05)}100%{transform:translateY(-3px) scale(1,1)}}
.puddle{transform-origin:12px 22px;animation:puddle 2s ease-in-out infinite}
@keyframes puddle{0%,50%,100%{transform:scaleX(.7);opacity:.2}70%{transform:scaleX(1.15);opacity:.45}}
@media (prefers-reduced-motion:reduce){ .ico *{animation:none!important} body,.bar i{transition:none!important}}
#foodForm{grid-template-columns:minmax(0,1fr) auto auto}
@media (max-width:360px){
  #foodForm{grid-template-columns:minmax(0,1fr) auto}
  #foodForm label{grid-column:1/-1}
}
@media (pointer:coarse){.chip,.seg button{min-height:44px;min-width:44px}}
.scanbtn{display:grid;place-items:center;padding:10px 14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.on{display:flex}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:18px 18px 0 0;max-height:calc(100% - env(safe-area-inset-top));overflow:auto;overscroll-behavior:contain;padding:18px max(16px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
@media (min-width:600px){ .modal{align-items:center} .sheet{border-radius:18px} }
#reader{width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:200px}
#reader video{width:100%!important;display:block}
.meta{color:var(--muted);font-size:.85rem}
.bar{height:5px;background:var(--line);border-radius:9px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
@media (max-width:520px){ .food{flex-wrap:wrap} .food .add{width:100%} .food .add input{flex:1;width:auto} }
</style>
</head>
<body>
<div class="wrap">
  <div id="app-header"></div>
  <script src="app-header.js"></script>


  <!-- التمارين -->
  <section class="panel on" id="workout">
    <h2 data-i18n="workouts"></h2>
    <p class="sub" data-i18n="workoutsSub"></p>

    <div class="card">
      <h3 style="margin-bottom:10px" data-i18n="programs"></h3>
      <div class="chips" id="progChips"></div>
      <p class="meta" id="progDesc" style="margin:10px 0 4px"></p>
      <div id="progList"></div>
      <button class="btn" id="progAll" style="margin-top:12px;width:100%" data-i18n="addProgram"></button>
    </div>

    <div class="card">
      <h3 style="margin-bottom:12px" data-i18n="addExercise"></h3>
      <form id="exForm">
        <label><span data-i18n="exName"></span><input name="name" required data-i18n-ph="exNamePh"></label>
        <label><span data-i18n="muscle"></span><select name="muscle" id="muscleSel"></select></label>
        <label><span data-i18n="equip"></span><select name="equip" id="equipSel"></select></label>
        <label><span data-i18n="weightKg"></span><input name="weight" type="number" min="0" step="0.5" placeholder="60"></label>
        <label><span data-i18n="sets"></span><input name="sets" type="number" min="1" max="100" required value="3"></label>
        <label><span data-i18n="reps"></span><input name="reps" type="number" min="1" max="3600" required value="10"></label>
        <label><span data-i18n="videoLink"></span><input name="video" type="url" data-i18n-ph="videoPh"></label>
        <button class="btn" type="submit" data-i18n="add"></button>
      </form>
      <div class="stats">
        <div class="stat"><b id="sCount">0</b><span data-i18n="exercisesN"></span></div>
        <div class="stat"><b id="sSets">0</b><span data-i18n="setsN"></span></div>
        <div class="stat"><b id="sVol">0</b><span data-i18n="volume"></span></div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:8px" data-i18n="exLog"></h3>
      <div class="tablewrap"><table>
        <thead><tr><th data-i18n="thEx"></th><th data-i18n="muscle"></th><th data-i18n="thEquip"></th><th data-i18n="thWeight"></th><th data-i18n="thSetsReps"></th><th data-i18n="thVideo"></th><th></th></tr></thead>
        <tbody id="exBody"></tbody>
      </table></div>
    </div>

    <div id="myVideos"></div>

    <div class="card">
      <h3 data-i18n="library"></h3>
      <p class="meta" style="margin:4px 0 12px" data-i18n="librarySub"></p>
      <div class="chips" id="libChips"></div>
      <input id="libSearch" data-i18n-ph="searchEx" style="margin:12px 0 4px">
      <div id="libList"></div>
      <a class="btn" href="https://www.youtube.com/@JeffNippard/videos" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none;margin-top:12px" data-i18n="allVideos"></a>
    </div>
  </section>

  <!-- التغذية -->
  <section class="panel" id="nutrition">
    <h2 data-i18n="nutrition"></h2>
    <p class="sub" data-i18n="nutritionSub"></p>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px"><h3 data-i18n="calc"></h3><button class="ghost" type="button" id="editProfile" data-i18n="editProfile" hidden></button></div>
      <form id="calForm">
        <label><span data-i18n="weightKg"></span><input name="w" type="number" min="25" max="350" step="0.1" required></label>
        <label><span data-i18n="heightCm"></span><input name="h" type="number" min="100" max="250" step="0.1" required></label>
        <label><span data-i18n="age"></span><input name="a" type="number" min="18" max="100" value="25" required></label>
        <label><span data-i18n="sex"></span><select name="g"><option value="m" data-i18n="male"></option><option value="f" data-i18n="female"></option></select></label>
        <label><span data-i18n="goal"></span><select name="goal"><option value="-400" data-i18n="cut"></option><option value="0" data-i18n="maintain"></option><option value="300" data-i18n="bulk"></option></select></label>
        <button class="btn" type="submit" data-i18n="calculate"></button><button class="ghost" type="button" id="cancelProfile" data-i18n="cancelProfile" hidden></button>
      </form>
      <div class="stats">
        <div class="stat"><span class="ico" data-ico="kcal"></span><b id="cKcal">—</b><span data-i18n="kcal"></span></div>
        <div class="stat"><span class="ico" data-ico="pro"></span><b id="cPro">—</b><span data-i18n="proteinG"></span></div>
        <div class="stat"><span class="ico" data-ico="carb"></span><b id="cCarb">—</b><span data-i18n="carbsG"></span></div>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:4px" data-i18n="foodSearch"></h3>
      <p class="sub" style="margin-bottom:12px;font-size:.9rem" data-i18n="foodSearchSub"></p>
      <form id="foodForm">
        <label><span data-i18n="foodQ"></span><input name="q" required data-i18n-ph="foodPh"></label>
        <button class="btn" type="submit" data-i18n="search"></button>
        <button class="btn scanbtn" type="button" id="scanBtn" data-i18n-aria="scanTitle">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>
        </button>
      </form>
      <div class="chips" id="foodShortcuts" style="margin-top:8px">
        <button class="chip" type="button" data-food="eggs" data-i18n="eggs"></button>
        <button class="chip" type="button" data-food="toast" data-i18n="toast"></button>
        <button class="chip" type="button" data-food="lusine" data-i18n="lusine"></button>
      </div>
      <label style="margin-top:8px"><select id="foodRegion" data-i18n-aria="saFood"><option value="sa" data-i18n="saFood"></option><option value="all" data-i18n="allFood"></option></select></label><div id="foodStatus" role="status" aria-live="polite" class="empty" style="display:none"></div>
      <div id="foodResults"></div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <h3 data-i18n="todayLog"></h3>
        <button class="ghost" id="clearLog" data-i18n="clearToday"></button>
      </div>
      <div class="stats" style="grid-template-columns:repeat(4,1fr)">
        <div class="stat"><span class="ico" data-ico="kcal"></span><b id="tKcal">0</b><span data-i18n="kcal"></span><div class="bar"><i id="pKcal"></i></div></div>
        <div class="stat"><span class="ico" data-ico="pro"></span><b id="tPro">0</b><span data-i18n="proteinG"></span><div class="bar"><i id="pPro"></i></div></div>
        <div class="stat"><span class="ico" data-ico="carb"></span><b id="tCarb">0</b><span data-i18n="carbsG"></span><div class="bar"><i id="pCarb"></i></div></div>
        <div class="stat"><span class="ico" data-ico="fat"></span><b id="tFat">0</b><span data-i18n="fatG"></span><div class="bar"><i id="pFat"></i></div></div>
      </div>
      <div class="tablewrap" style="margin-top:12px"><table>
        <thead><tr><th data-i18n="thFood"></th><th data-i18n="thBrand"></th><th data-i18n="thQty"></th><th data-i18n="kcal"></th><th data-i18n="P"></th><th data-i18n="C"></th><th data-i18n="F"></th><th></th></tr></thead>
        <tbody id="logBody"></tbody>
      </table></div>
    </div>

    <div class="grid" id="meals"></div>

    <h3 style="margin:24px 0 12px" data-i18n="nutVideos"></h3>
    <div class="grid" id="nutVids"></div>
  </section>
</div>

<div class="wrap" style="padding-top:0">
  <div class="card">
    <h3 data-i18n="yourData"></h3>
    <p class="meta" style="margin:4px 0 12px" data-i18n="yourDataSub"></p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="exportBtn" data-i18n="backup"></button>
      <label class="ghost" style="display:grid;place-items:center;padding:8px 16px;cursor:pointer"><span data-i18n="restore"></span><input type="file" accept="application/json,.json" id="importFile" hidden></label>
    </div>
  </div>
</div>

<div class="modal" id="scanModal" role="dialog" aria-modal="true" aria-labelledby="scanTitleHeading">
  <div class="sheet">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 id="scanTitleHeading" data-i18n="scanTitle"></h3><button class="ghost" id="scanClose" data-i18n="close"></button>
    </div>
    <div id="reader"></div>
    <p class="meta" id="scanMsg" role="status" aria-live="polite" style="text-align:center;margin:10px 0"></p>
    <button class="ghost" type="button" id="scanPhotoBtn" data-i18n="scanPhoto"></button>
    <input type="file" accept="image/*" id="scanFile" hidden>
  </div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const store = {
  get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ytId(value) {
  const input = String(value || '').trim();
  if (!input) return null;
  try {
    const url = new URL(input.includes('://') ? input : 'https://' + input);
    if (!['https:', 'http:'].includes(url.protocol)) return null;
    const host = url.hostname.toLowerCase();
    const [route, resource] = url.pathname.split('/').filter(Boolean);
    const isYouTube = ['youtube.com', 'www.youtube.com', 'm.youtube.com', 'youtube-nocookie.com', 'www.youtube-nocookie.com'].includes(host);
    const id = host === 'youtu.be' ? route : isYouTube && (route === 'watch'
      ? url.searchParams.get('v')
      : ['embed', 'shorts', 'live'].includes(route) ? resource : null);
    return typeof id === 'string' && /^[\w-]{11}$/.test(id) ? id : null;
  } catch {
    return null;
  }
}
const ytWatch = id => 'https://www.youtube.com/watch?v=' + id;
const ytSearch = q => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);

$('#foodForm').onsubmit = async ev => {
  ev.preventDefault();
  const q = new FormData(ev.target).get('q').trim();
  if (!q) return;
  const sequence = ++searchSequence; const local = localFoods(q); results = local; renderResults(); status('searching');
  try {
    let products;
    if (/^\d{8,14}$/.test(q)) {
      const r = await foodJSON(`${OFF}/api/v2/product/${q}.json?fields=${FIELDS}`, true);
      products = r.product ? [r.product] : [];
    } else {
      const normalized = normalizeFood(q);
      const term = q.split(/\s+/).map(word => {
        const key = normalizeFood(word);
        return Object.hasOwn(brandAliases,key) ? brandAliases[key] : word;
      }).join(' ');
      const saudi = $('#foodRegion').value === 'sa';
      const url = `${OFF}/cgi/search.pl?search_terms=${encodeURIComponent(term)}&search_simple=1&action=process&json=1&page_size=24&fields=${FIELDS}` +
        (saudi ? '&tagtype_0=countries&tag_contains_0=contains&tag_0=saudi-arabia' : '');
      const requests = [foodJSON(url)];
      const category = foodCategories.get(normalized.replace(/^ال/, ''));
      if (category) {
        const params = new URLSearchParams({categories_tags:'en:' + category, page_size:12, fields:FIELDS});
        if (saudi) params.set('countries_tags', 'en:saudi-arabia');
        requests.push(foodJSON(`${OFF}/api/v2/search?${params}`));
      }
      const responses = await Promise.allSettled(requests);
      const successful = responses.filter(response => response.status === 'fulfilled');
      if (!successful.length) throw responses[0].reason;
      products = successful.flatMap(response => response.value.products || []);
      if (!products.length && successful.length < responses.length) throw Error('Incomplete search');

  if(k==='prog') return typeof v==='string' && (Object.prototype.hasOwnProperty.call(programs,v) || Object.prototype.hasOwnProperty.call(OLD_PROG,v));
  if(k==='profile') return v && ['w','h','a'].every(x=>['string','number'].includes(typeof v[x]) && String(v[x]).trim()!=='' && Number.isFinite(+v[x])) && +v.w>=25 && +v.w<=350 && +v.h>=100 && +v.h<=250 && +v.a>=18 && +v.a<=100 && ['m','f'].includes(v.g) && ['-400','0','300'].includes(String(v.goal));
  if(k==='target') return v && ['kcal','pro','carb','fat'].every(x=>finiteNonnegative(v[x]));
  if(k==='exercises') return Array.isArray(v) && v.every(e=>e && typeof e.name==='string' && typeof e.muscle==='string' && typeof e.equip==='string' && (e.video===undefined || typeof e.video==='string') && (e.key===undefined || typeof e.key==='string') && (e.ar===undefined || typeof e.ar==='string') && (e.en===undefined || typeof e.en==='string') && [e.sets,e.reps].every(x=>['number','string'].includes(typeof x)&&Number.isInteger(+x)&&+x>0) && ['string','number'].includes(typeof e.weight) && Number.isFinite(+e.weight)&&+e.weight>=0);
  return Array.isArray(v) && v.every(e=>e && typeof e.name==='string' && typeof e.brand==='string' && ['g','kcal','pro','carb','fat'].every(x=>finiteNonnegative(e[x])) && e.g>0);
}
$('#exportBtn').onclick = () => {
  const data = {}; try { for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (backupKey(k)) data[k] = localStorage.getItem(k); } } catch(e){}
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({app:'I42FIT',version:1,data})], {type:'application/json'}));
  a.download = `I42FIT-backup-${today()}.json`; a.click(); URL.revokeObjectURL(a.href);
};
$('#importFile').onchange = async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try {
    if(f.size > 10*1024*1024) throw Error('size');
    const parsed = JSON.parse(await f.text());
    if(!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw Error('format');
    if(Object.hasOwn(parsed,'app') && (parsed.app!=='I42FIT' || parsed.version!==1)) throw Error('version');
    const data = parsed.app==='I42FIT' ? parsed.data : parsed;
    if(!data || typeof data!=='object' || Array.isArray(data)) throw Error('data');
    const entries = Object.entries(data).filter(([k])=>backupKey(k));
    if(!entries.length || !entries.every(([k,v])=>typeof v==='string' && validBackupValue(k,JSON.parse(v)))) throw Error('invalid');
    const before = entries.map(([k])=>[k,localStorage.getItem(k)]);
    try { entries.forEach(([k,v])=>localStorage.setItem(k,v)); }
    catch(e){ before.forEach(([k,v])=>{try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(_){} }); throw e; }
    location.reload();
  }
  catch(e){ alert(t('badFile')); }
};

// ===== رسم كل شيء (عند التشغيل وعند تغيير اللغة) =====
function renderAll(){
  applyStatic(); paintTheme();
  renderProg(); renderEx(); renderLib(); renderNutStatic(); renderLog(); showTarget(); renderResults();
  if (lastStatus) status(lastStatus);
  $('#scanMsg').textContent = t(scanKey);
}
renderAll();
</script>
